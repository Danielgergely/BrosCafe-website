# Security headers, included into every location block.
#
# nginx does NOT merge add_header across levels: as soon as a location declares
# one add_header, every add_header from the server block is discarded. So these
# have to be included explicitly wherever a location sets its own headers,
# rather than declared once at server level.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
