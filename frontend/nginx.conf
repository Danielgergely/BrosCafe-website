server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # TLS is terminated by the platform's router in front of this container.
    # Behave correctly behind it.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    client_max_body_size 4m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The API must answer on the same origin as the site. Apple bakes
    # "<origin>/api/wallet" into every Wallet pass and calls back on exactly
    # that host, so splitting these across two domains breaks issued passes.
    # `^~` matters: it stops nginx evaluating the regex location further down,
    # which would otherwise claim every /api/ path ending in an asset
    # extension — the wallet hero images and uploaded media among them.
    location ^~ /api/ {
        # Photo uploads from the admin dashboard. Sits above the backend's own
        # MAX_UPLOAD_MB so an oversized file gets the API's readable error
        # rather than nginx's default 413 page.
        client_max_body_size 25m;

        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Hashed asset filenames are safe to cache indefinitely.
    location /static/ {
        include /etc/nginx/snippets/security-headers.conf;
        # Only add_header here: `expires` would emit a second, conflicting
        # Cache-Control that nginx concatenates onto this one.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html must never be cached, or a deploy leaves browsers on the old
    # bundle whose hashed assets no longer exist.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Client-side routing: unknown paths are React Router's problem, not a 404.
    # Asset-shaped requests must 404 rather than fall through to index.html.
    # The SPA fallback otherwise answers a missing icon or image with HTML and
    # a 200, so a broken asset looks fine to curl and simply fails silently in
    # the browser — which is exactly how the favicon went missing unnoticed.
    location ~* \.(?:ico|png|jpe?g|gif|svg|webp|avif|mp4|webm|woff2?|ttf|eot|map|txt|json)$ {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
