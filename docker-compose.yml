# Bros Cafe — the whole system: website, API, database.
#
# One file serves both environments. What differs between stage and production
# is the .env file you point at it, never this file:
#
#   docker compose --env-file .env.stage -p broscafe-stage up -d --build
#   docker compose --env-file .env.prod  -p broscafe-prod  up -d --build
#
# Separate project names (-p) keep the two sets of containers and volumes
# apart, so stage can never touch production data.
#
# Only the `web` container publishes a port. The API and the database are
# reachable only from inside the compose network — the API through nginx at
# /api, the database not at all from outside.

services:
  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      # Bind to localhost so the platform's reverse proxy (which terminates
      # TLS) is the only way in. Change HOST_PORT per environment.
      - "127.0.0.1:${HOST_PORT:-8080}:80"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:?set DB_NAME}
      JWT_SECRET: ${JWT_SECRET:?generate with openssl rand -hex 32}
      FRONTEND_URL: ${FRONTEND_URL:?the public https origin, e.g. https://broscafe.hu}
      CORS_ORIGINS: ${FRONTEND_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
      # Ship content changes with a deploy: re-seed products and journal posts
      # from backend/data/*.json on boot. Turn off once you edit via /admin.
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
      STAMPS_REQUIRED: ${STAMPS_REQUIRED:-4}
      OPENING_DATETIME: ${OPENING_DATETIME:-2026-09-16T08:00:00}
      CAFE_TIMEZONE: ${CAFE_TIMEZONE:-Europe/Budapest}
      CAFE_NAME: ${CAFE_NAME:-Bros Cafe}
      CAFE_ADDRESS: ${CAFE_ADDRESS:-}
      CAFE_INSTAGRAM: ${CAFE_INSTAGRAM:-}
      CAFE_EMAIL: ${CAFE_EMAIL:-}
      CAFE_HOURS_WEEKDAYS: ${CAFE_HOURS_WEEKDAYS:-}
      CAFE_HOURS_WEEKEND: ${CAFE_HOURS_WEEKEND:-}
      # Resend. Without a key nobody can sign in — magic links are the only
      # way into a customer account. The sending domain must be verified and
      # listed in broscafe.hu's single SPF record.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Bros Cafe <hello@broscafe.hu>}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Bros Cafe}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      # Apple Wallet. Leave APPLE_PASS_CONFIGURED unset and passes stay off.
      APPLE_PASS_CONFIGURED: ${APPLE_PASS_CONFIGURED:-false}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_PASS_TYPE_ID: ${APPLE_PASS_TYPE_ID:-}
      # Uploaded photography. The volume below is the only copy of these files.
      MEDIA_DIR: /data/media
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}

      APPLE_CERT_PEM_PATH: /run/certs/pass.pem
      APPLE_KEY_PEM_PATH: /run/certs/ios-private-key.pem
      APPLE_WWDR_CERT_PATH: /run/certs/wwdr.pem

      # Google Wallet. The service-account JSON is a file rather than an env
      # var: it is multi-line with an embedded PEM key, which pasting into a
      # dashboard mangles. Drop it next to the Apple certificates.
      GOOGLE_WALLET_CONFIGURED: ${GOOGLE_WALLET_CONFIGURED:-false}
      GOOGLE_ISSUER_ID: ${GOOGLE_ISSUER_ID:-}
      GOOGLE_SERVICE_ACCOUNT_PATH: /run/certs/google-service-account.json
      GOOGLE_WALLET_CLASS_SUFFIX: ${GOOGLE_WALLET_CLASS_SUFFIX:-broscafe_loyalty}
      GOOGLE_WALLET_LOGO_URL: ${GOOGLE_WALLET_LOGO_URL:-}
    volumes:
      # Private keys live on the host, never in the image or in git.
      - ${CERTS_DIR:-./backend/certs}:/run/certs:ro
      # Admin-uploaded images. Named volume so it survives
      # redeploys — losing it means every uploaded photo is gone.
      - media:/data/media

  mongo:
    # Pinned via env so the version can be changed without editing this file.
    # MongoDB 5.0+ requires a CPU exposing AVX. Some VPS hosts run KVM with the
    # generic `qemu64` CPU model, which masks AVX (and SSE4.2) even when the
    # physical host has them — Mongo 5+ then crash-loops on startup. Check with
    # `grep -w avx /proc/cpuinfo`; if it is missing, ask the provider to switch
    # the VM to host-passthrough, and run MONGO_IMAGE=mongo:4.4 until they do.
    image: ${MONGO_IMAGE:-mongo:7}
    restart: unless-stopped
    # Cap the WiredTiger cache. Left alone, MongoDB claims half of (RAM - 1GB) —
    # about 1.5 GB on a 4 GB server — which it does not need for a dataset this
    # size and which competes with the frontend build for memory.
    command:
      - "--bind_ip_all"
      - "--wiredTigerCacheSizeGB"
      - "${MONGO_CACHE_GB:-0.5}"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # mongosh only exists from Mongo 6; `mongo` is the shell before that.
      # Try both so the healthcheck works whichever image is pinned.
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval 'db.runCommand({ping:1}).ok' ||
          mongo --quiet --eval 'db.runCommand({ping:1}).ok'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  mongo-data:
  media:
