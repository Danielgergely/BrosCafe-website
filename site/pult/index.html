<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Olvasó · Bros Cafe</title>
<meta name="description" content="A Bros Cafe pultjának kártyaolvasója munkatársaknak.">
<meta name="theme-color" content="#25251C">
<link rel="icon" href="/shared/img/mark-olive.png">
<link rel="preload" href="/shared/fonts/fraunces-latin-full-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/shared/fonts/fraunces-latin-ext-full-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/shared/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/shared/fonts/inter-latin-ext-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="expect" href="#site-header" blocking="render">
<script src="/i18n.js"></script>
<link rel="stylesheet" href="/shell.css">
<link rel="stylesheet" href="/pages.css">
<link rel="stylesheet" href="/pult/pult.css">
<script src="/glass.js" defer></script>
</head>
<!-- data-page is "scanner", not "pult": site.js still carries the old mock-up under that name -->
<body class="sub" data-page="scanner">
<script src="/shell.js"></script>
<main id="tartalom" class="st" data-view="loading">
  <div class="st__bar">
    <h1 class="st__title" data-vt="page-title">Kártya beolvasása</h1>
    <div class="st__tools">
      <span class="st__who" id="st-who"></span>
      <button class="st__tool" id="st-sound" type="button" aria-pressed="true">Hang</button>
      <a class="st__tool" id="st-admin" href="/admin/" hidden>Admin</a>
      <button class="st__tool" id="st-logout" type="button">Kijelentkezés</button>
    </div>
  </div>

  <p class="st__wait" id="st-wait">Betöltés…</p>

  <section class="st__scan" id="st-scan" aria-label="Olvasó" hidden>
    <div class="cam" id="st-cam" data-state="off">
      <video id="st-video" playsinline muted disablepictureinpicture></video>
      <span class="cam__frame" aria-hidden="true"></span>
      <p class="cam__state" id="st-camstate" aria-live="polite">Kamera kikapcsolva</p>
      <button class="cam__flip" id="st-flip" type="button" hidden>Kameraváltás</button>
    </div>
    <div class="st__side">
      <p class="st__lead">Fordítsd a kamerát a vendég QR-kódjára.</p>
      <button class="sb sb--main sb--xl" id="st-start" type="button">Olvasás indítása</button>
      <form class="st__manual" id="st-form" novalidate>
        <label for="st-code">Kártyakód beírása</label>
        <div class="st__row">
          <input id="st-code" type="text" inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search" maxlength="80">
          <button class="sb" id="st-find" type="submit">Keresés</button>
        </div>
      </form>
    </div>
  </section>

  <section class="st__member" id="st-member" aria-label="Vendég" hidden>
    <div class="mc" id="st-card" aria-live="polite"></div>
    <div class="ma" id="st-actions"></div>
  </section>

  <div class="st__toast" id="st-toast" role="status" aria-live="assertive" hidden></div>
</main>
<script src="/belepes/staff.js" defer></script>
<script src="/pult/pult.js" defer></script>
</body>
</html>
